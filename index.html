<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食單 — 一張單子，看完一家店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   顏色與字型都定義在這裡，改這一區就能換掉整個網站的長相
   ============================================================ */
:root{
  --ink:#12211E;         /* 主要文字：帶綠的深墨色 */
  --board:#0F3B34;       /* 招牌綠：老店壓克力招牌的那種綠 */
  --paper:#F2EDDF;       /* 點餐單的紙色 */
  --paper-line:#D9D0B8;
  --stamp:#C4342C;       /* 紅印章：重點、雷點 */
  --lamp:#E8B33C;        /* 燈箱黃：評分、強調 */
  --muted:#6E7B75;
  --radius:10px;
  --shadow:0 2px 0 rgba(0,0,0,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--board);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:3px solid var(--lamp); outline-offset:2px;}

/* ---------- 頁首（招牌會跟著選到的店換名字） ---------- */
header{
  background:var(--board);
  border-bottom:2px solid rgba(242,237,223,.18);
  padding:20px 20px 18px;
}
.wrap{max-width:1120px;margin:0 auto;}
.mark{
  font-size:12px;letter-spacing:.42em;color:var(--lamp);
  font-weight:700;margin:0 0 6px 3px;
}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
.logo{
  font-family:"Noto Serif TC",serif;font-weight:900;font-size:32px;
  letter-spacing:.1em;color:var(--paper);
  border:2px solid var(--lamp);padding:2px 16px 5px;border-radius:4px;
}
.tagline{color:rgba(242,237,223,.7);font-size:14px;letter-spacing:.04em;margin:0;}

/* ---------- 搜尋列 ---------- */
.searchbar{margin-top:18px;}
.searchbar input{
  width:100%;
  background:var(--paper);border:none;border-radius:var(--radius);
  padding:13px 16px;font-size:16px;color:var(--ink);
  font-family:inherit;box-shadow:var(--shadow);
}
.searchbar input::placeholder{color:#9AA39D;}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.tag{
  background:transparent;color:rgba(242,237,223,.8);
  border:1px solid rgba(242,237,223,.35);border-radius:999px;
  padding:5px 14px;font-size:13px;transition:.15s;
}
.tag:hover{border-color:var(--lamp);color:var(--lamp);}
.tag[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--ink);font-weight:700;}

/* ---------- 主要版面 ---------- */
main{padding:22px 20px 60px;}
.layout{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start;}
@media (max-width:900px){ .layout{grid-template-columns:1fr;} }

/* ---------- 左邊：店家清單 ---------- */
.listhead{color:rgba(242,237,223,.6);font-size:12px;letter-spacing:.16em;margin:0 0 10px 2px;}
.card{
  width:100%;text-align:left;display:block;
  background:var(--paper);border:none;border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(0,0,0,.2);}
.card[aria-current="true"]{box-shadow:0 0 0 3px var(--lamp), var(--shadow);}
.card h3{margin:0;font-size:17px;font-weight:700;}
.card .meta{margin:3px 0 0;color:var(--muted);font-size:13px;}
.score{display:inline-flex;align-items:baseline;gap:4px;margin-top:6px;font-family:"Roboto Mono",monospace;font-weight:700;}
.score b{font-size:18px;color:var(--stamp);}
.score span{font-size:12px;color:var(--muted);font-weight:400;}
.empty{background:var(--paper);border-radius:var(--radius);padding:18px;color:var(--muted);}

/* ---------- 右邊：詳細內容 ---------- */
.detail{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.detail-head{padding:22px 24px 18px;border-bottom:1px dashed var(--paper-line);}
.detail-head h2{margin:0;font-family:"Noto Serif TC",serif;font-size:27px;font-weight:900;letter-spacing:.02em;}
.detail-head .addr{margin:6px 0 0;color:var(--muted);font-size:14px;}
.chip{
  display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;
  padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:2px;
}
.chip.open{background:#1F6B4A;color:#EAF6EF;}
.chip.closed{background:#B9B2A0;color:#3A3A34;}

/* 招牌元素：收據樣式的重點單 */
.slip{
  margin:20px 24px;background:#FFFDF6;
  border:1px solid var(--paper-line);
  border-radius:6px;padding:18px 20px 20px;position:relative;
}
.slip::before{
  content:"";position:absolute;left:0;right:0;top:-1px;height:5px;
  background:repeating-linear-gradient(90deg,var(--stamp) 0 12px,transparent 12px 24px);
  border-radius:6px 6px 0 0;
}
.slip h4{
  margin:4px 0 14px;font-size:12px;letter-spacing:.22em;color:var(--stamp);
  font-weight:700;font-family:"Roboto Mono",monospace;
}
.slip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;}
.slip dt{
  font-size:12px;font-weight:700;letter-spacing:.08em;color:#fff;
  background:var(--board);padding:2px 8px;border-radius:3px;height:fit-content;white-space:nowrap;
}
.slip dt.bad{background:var(--stamp);}
.slip dt.price{background:var(--lamp);color:var(--ink);}
.slip dd{margin:0;font-size:15px;line-height:1.6;}
.slip dd.mono{font-family:"Roboto Mono","Noto Sans TC",monospace;font-size:14px;}
.slip .from{
  margin:16px 0 0;padding-top:12px;border-top:1px dashed var(--paper-line);
  font-size:12px;color:var(--muted);font-family:"Roboto Mono","Noto Sans TC",monospace;
}

/* 分頁 */
.tabs{display:flex;flex-wrap:wrap;padding:0 24px;border-bottom:1px solid var(--paper-line);}
.tabs button{
  background:none;border:none;padding:12px 4px;margin-right:24px;
  font-size:14px;font-weight:700;color:var(--muted);
  border-bottom:3px solid transparent;
}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--stamp);}
.panel{padding:20px 24px 26px;}

/* Google 評論 */
.review{padding:14px 0;border-bottom:1px dashed var(--paper-line);}
.review:last-child{border-bottom:none;}
.review .top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);}
.review .stars{color:var(--lamp);letter-spacing:2px;font-size:14px;}
.review p{margin:5px 0 0;}
.attrib{
  margin-top:14px;font-size:12px;color:var(--muted);
  background:#FFFDF6;border:1px solid var(--paper-line);border-radius:6px;padding:10px 12px;
}

/* 部落客食記 */
.post{display:block;text-decoration:none;color:inherit;padding:13px 0;border-bottom:1px dashed var(--paper-line);}
.post:last-of-type{border-bottom:none;}
.post h5{margin:0;font-size:16px;font-weight:700;}
.post:hover h5{color:var(--stamp);text-decoration:underline;}
.post .src{font-size:12px;color:var(--muted);margin:3px 0 0;}
.post p{margin:5px 0 0;color:#4A554F;font-size:14px;}

/* IG */
.ig-note{color:#4A554F;margin:0 0 16px;}
.ig-btn{
  display:inline-block;text-decoration:none;background:var(--ink);color:var(--paper);
  padding:12px 22px;border-radius:var(--radius);font-weight:700;font-size:15px;
}
.ig-btn:hover{background:var(--stamp);}

/* 地圖與附近 */
.map{
  width:100%;height:290px;border:1px solid var(--paper-line);
  border-radius:6px;background:#E6E2D6;display:block;
}
.map-actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 24px;}
.linkbtn{
  text-decoration:none;font-size:14px;font-weight:700;
  border:1px solid var(--ink);border-radius:var(--radius);
  padding:9px 16px;color:var(--ink);
}
.linkbtn:hover{background:var(--ink);color:var(--paper);}
.nearby-head{font-size:12px;letter-spacing:.18em;color:var(--stamp);font-weight:700;margin:0 0 4px;font-family:"Roboto Mono",monospace;}
.nearby-sub{margin:0 0 12px;font-size:13px;color:var(--muted);}
.near{
  width:100%;text-align:left;background:#FFFDF6;border:1px solid var(--paper-line);
  border-radius:6px;padding:11px 14px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.near:hover{border-color:var(--stamp);}
.near .n-name{font-weight:700;font-size:15px;}
.near .n-meta{font-size:12px;color:var(--muted);}
.near .n-dist{
  font-family:"Roboto Mono",monospace;font-weight:700;font-size:14px;
  color:var(--stamp);white-space:nowrap;
}

footer{color:rgba(242,237,223,.45);font-size:12px;text-align:center;padding:0 20px 40px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="mark">食單</p>

    <div id="detail"></div>
  </div>
</main>

<footer>雛形展示用，店家與評論皆為虛構資料。</footer>

/* ============================================================
   以下是程式邏輯 —— 先看得懂上面的資料就好，這區之後再研究
   ============================================================ */
const listEl   = document.getElementById("list");
const detailEl = document.getElementById("detail");
const headEl   = document.getElementById("listhead");
const tagsEl   = document.getElementById("tags");
const brandEl  = document.getElementById("brandName");
const qEl      = document.getElementById("q");

let activeTag = "全部";
let selected  = STORES[0].name;
let activeTab = "google";

const TAGS = ["全部", ...new Set(STORES.map(s => s.type))];
tagsEl.innerHTML = TAGS.map(t =>
  `<button class="tag" data-tag="${t}" aria-pressed="${t === activeTag}">${t}</button>`
).join("");

tagsEl.addEventListener("click", e => {
  const btn = e.target.closest(".tag");
  if (!btn) return;
  activeTag = btn.dataset.tag;
  render();
});
qEl.addEventListener("input", render);

function filtered(){
  const q = qEl.value.trim().toLowerCase();
  return STORES.filter(s => {
    const matchTag = activeTag === "全部" || s.type === activeTag;
    const hay = `${s.name} ${s.type} ${s.area} ${s.address}`.toLowerCase();
    const matchQ = q === "" || q.split(/\s+/).every(w => hay.includes(w));
    return matchTag && matchQ;
  });
}

function stars(n){ return "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n)); }

/* 兩點經緯度之間的直線距離（公尺）。
   想像地球是一顆球，這個公式在算球面上兩點的最短距離。 */
function distance(a, b){
  const R = 6371000;                       // 地球半徑（公尺）
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 +
            Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function readable(m){
  return m < 1000 ? `${Math.round(m/10)*10} 公尺` : `${(m/1000).toFixed(1)} 公里`;
}
/* 找出 3 公里內的其他店，由近到遠排序 */
function nearbyOf(s){
  return STORES
    .filter(o => o.name !== s.name)
    .map(o => ({ store:o, m:distance(s, o) }))
    .filter(x => x.m <= 3000)
    .sort((a,b) => a.m - b.m);
}

function render(){
  const items = filtered();
  headEl.textContent = `找到 ${items.length} 家`;

  if (items.length === 0){
    listEl.innerHTML = `<div class="empty">沒有符合的店家。換個關鍵字，或點上面的「全部」看所有店。</div>`;
    detailEl.innerHTML = "";
    brandEl.textContent = "選一家店";
    document.title = "食單 — 一張單子，看完一家店";
    return;
  }

  if (!items.some(s => s.name === selected)) selected = items[0].name;

  listEl.innerHTML = items.map(s => `
    <button class="card" data-name="${s.name}" aria-current="${s.name === selected}">
      <h3>${s.name}</h3>
      <p class="meta">${s.type}・${s.area}</p>
      <span class="score"><b>${s.rating}</b><span>${s.count.toLocaleString()} 則評論</span></span>
    </button>
  `).join("");

  renderDetail(STORES.find(s => s.name === selected));
}

function renderDetail(s){
  // 招牌換成目前這家店的名字
  brandEl.textContent = s.name;
  document.title = `${s.name} — 食單`;

  const near = nearbyOf(s);
  const bbox = [s.lng - 0.005, s.lat - 0.003, s.lng + 0.005, s.lat + 0.003].join("%2C");

  detailEl.innerHTML = `
    <div class="detail">
      <div class="detail-head">
        <h2>${s.name}<span class="chip ${s.open ? "open" : "closed"}">${s.open ? "營業中" : "休息中"}</span></h2>
        <p class="addr">${s.address}</p>
      </div>

      <!-- 招牌功能：把所有來源濃縮成一張點餐單 -->
      <section class="slip">
        <h4>重 點 單</h4>
        <dl>
          <dt>好吃在哪</dt><dd>${s.summary.good}</dd>
          <dt>必點</dt><dd class="mono">${s.summary.must}</dd>
          <dt class="price">價位</dt><dd class="mono">${s.summary.price}</dd>
          <dt class="bad">雷點</dt><dd>${s.summary.bad}</dd>
          <dt>適合誰</dt><dd>${s.summary.who}</dd>
        </dl>
        <p class="from">整理自 Google 評論 ${s.reviews.length} 則、部落客食記 ${s.posts.length} 篇。<br>此為雛形展示，實際版本由 AI 即時彙整。</p>
      </section>

      <div class="tabs" role="tablist">
        <button role="tab" data-tab="google" aria-selected="${activeTab==="google"}">Google 評論</button>
        <button role="tab" data-tab="posts"  aria-selected="${activeTab==="posts"}">部落客食記</button>
        <button role="tab" data-tab="ig"     aria-selected="${activeTab==="ig"}">IG 打卡</button>
        <button role="tab" data-tab="map"    aria-selected="${activeTab==="map"}">地圖・附近</button>
      </div>

      ${activeTab === "google" ? `
      <div class="panel">
        <div class="score"><b>${s.rating}</b><span>／ 5.0・共 ${s.count.toLocaleString()} 則</span></div>
        ${s.reviews.map(r => `
          <div class="review">
            <div class="top"><span>${r.author}<span class="stars"> ${stars(r.rating)}</span></span><span>${r.time}</span></div>
            <p>${r.text}</p>
          </div>`).join("")}
        <p class="attrib">評論由 Google 提供，僅顯示 5 則且不儲存 —— 這是 Google 條款的規定，正式版需標示 Google 標誌與原作者連結。</p>
      </div>` : ""}

      ${activeTab === "posts" ? `
      <div class="panel">
        ${s.posts.map(p => `
          <a class="post" href="#" onclick="return false;">
            <h5>${p.title}</h5>
            <p class="src">${p.src}</p>
            <p>${p.snippet}</p>
          </a>`).join("")}
        <p class="attrib">只顯示標題與一句摘要，點擊帶去原文，不轉載全文。</p>
      </div>` : ""}

      ${activeTab === "ig" ? `
      <div class="panel">
        <p class="ig-note">IG 不開放讓第三方抓取別人的貼文，所以這裡不存任何 IG 內容，直接把你帶到 IG 上這家店的標籤頁。</p>
        <a class="ig-btn" href="https://www.instagram.com/explore/tags/${encodeURIComponent(s.ig)}/" target="_blank" rel="noopener">在 IG 看 #${s.ig}</a>
      </div>` : ""}

      ${activeTab === "map" ? `
      <div class="panel">
        <iframe class="map" title="${s.name} 位置圖" loading="lazy"
          src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${s.lat}%2C${s.lng}"></iframe>
        <div class="map-actions">
          <a class="linkbtn" target="_blank" rel="noopener"
             href="https://www.google.com/maps/search/?api=1&query=${s.lat}%2C${s.lng}">在 Google 地圖開啟</a>
          <a class="linkbtn" target="_blank" rel="noopener"
             href="https://www.google.com/maps/dir/?api=1&destination=${s.lat}%2C${s.lng}">導航到這裡</a>
        </div>

        <p class="nearby-head">走 路 可 到</p>
        ${near.length ? `
          <p class="nearby-sub">從${s.name}出發，3 公里內的其他店：</p>
          ${near.map(n => `
            <button class="near" data-name="${n.store.name}">
              <span>
                <span class="n-name">${n.store.name}</span>
                <span class="n-meta"><br>${n.store.type}・評分 ${n.store.rating}</span>
              </span>
              <span class="n-dist">${readable(n.m)}</span>
            </button>`).join("")}
        ` : `<p class="nearby-sub">3 公里內沒有其他收錄的店家。資料變多之後這裡就會有內容。</p>`}
      </div>` : ""}
    </div>
  `;
}

// 點左邊卡片 → 換右邊內容
listEl.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  selected = card.dataset.name;
  activeTab = "google";
  render();
});

// 點分頁，或點「附近」的店
detailEl.addEventListener("click", e => {
  const near = e.target.closest(".near");
  if (near){
    selected = near.dataset.name;
    activeTab = "map";
    qEl.value = "";        // 清掉搜尋字，免得跳過去的店被過濾掉
    activeTag = "全部";
    tagsEl.querySelectorAll(".tag").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.tag === "全部"));
    render();
    window.scrollTo({ top:0, behavior:"smooth" });
    return;
  }
  const tab = e.target.closest("[data-tab]");
  if (!tab) return;
  activeTab = tab.dataset.tab;
  renderDetail(STORES.find(s => s.name === selected));
});

render();
</script>
